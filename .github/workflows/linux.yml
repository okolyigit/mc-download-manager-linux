name: linux

# Builds the Linux app and runs upstream's self-check against the Linux engine build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Self-check
        run: dotnet run --project linux/Tests -c Release

      - name: Build
        run: dotnet build linux/MCDownloadManager.Linux -c Release
